<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Login | Blissful Bumps Prenatal Yoga</title>
  <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="member.css">
</head>
<body class="auth-body">

  <div class="petals" aria-hidden="true">
    <span style="left:8%; animation-delay:-2s">🌸</span>
    <span style="left:22%; animation-delay:-7s">🌸</span>
    <span style="left:47%; animation-delay:-4s">🌸</span>
    <span style="left:71%; animation-delay:-9s">🌸</span>
    <span style="left:88%; animation-delay:-5s">🌸</span>
  </div>

  <main class="auth-wrap">
    <div class="auth-card">
      <a href="index.html" class="auth-logo">
        <span class="logo-icon">🌸</span>
        <span class="logo-text">
          Blissful Bumps
          <small>Prenatal Yoga</small>
        </span>
      </a>

      <h1>Welcome back</h1>
      <p class="auth-sub">Log in to continue your pregnancy yoga journey.</p>

      <div class="auth-error" id="auth-error" hidden></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="priya@example.com" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="login-password">Password</label>
          <div class="pw-wrap">
            <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password">Show</button>
          </div>
        </div>

        <button type="submit" class="auth-btn">Log In</button>
      </form>

      <div class="demo-box">
        <strong>Demo login</strong>
        <span>Email: <code>demo@blissfulbumps.in</code></span>
        <span>Password: <code>yoga123</code></span>
      </div>

      <a href="index.html" class="back-link">← Back to website</a>
    </div>
  </main>

  <script src="login.js"></script>
</body>
</html>
